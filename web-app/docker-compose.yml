version: "3.8"

services:
  readalong-server:
    build:
      context: ../rust-core
      dockerfile: ../web-app/Dockerfile
    container_name: readalong-server
    ports:
      - "3000:3000"
    volumes:
      - readalong_data:/app/data
    restart: unless-stopped
    environment:
      - API_TOKEN=${API_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  readalong_data: